name: Rails assets

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    - cron: "0 21 * * 6"

permissions:
  contents: read

env:
  DEVISE_MAILER_SENDER: "robot@evemonk.com"
  ACTION_MAILER_FROM: "EveMonk <robot@evemonk.com>"
  DEVISE_PEPPER: "e19db51a470b8259e79616ac00450ea1857d819aa860e2e7cff79b3c295d3993867a68c9524587d2b02b6f76efa8dea8aaf09884f186bfab89442eb2530ea829"
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "mkc5rxt3Hi544vRckLunUNuLKMTQAsEK"
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "aG4fsR8nqlJtL8mXEQ4qFoJiPvLPGCQT"
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "Vp73xHIjPScH6fxGhwsEH6h4CAHOx6DL"

jobs:
  precompile:
    runs-on: ubuntu-24.04

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          rubygems: latest
          bundler: latest
          bundler-cache: true
      - name: Disable skylight dev warning
        run: bundle exec skylight disable_dev_warning
      - run: cp -f config/evemonk.example.yml config/evemonk.yml
      - run: bin/rails SECRET_KEY_BASE=no assets:precompile
